<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AOT Exodus - Registro Administrativo</title>
<meta name="theme-color" content="#8b1e1e">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#120e0d;--card:#1c1614;--tx:#efe6d8;--mu:#a2968a;--bd:#3a2c28;--ac:#8b1e1e;--ac2:#6fbf84;--wn:#d9a441;--gd:#c9a24b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2a1311 0,var(--bg) 55%) fixed;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2{font-family:Cinzel,Georgia,serif;letter-spacing:2px;text-transform:uppercase}
header{padding:12px 18px;background:linear-gradient(90deg,#5c1212,var(--ac));border-bottom:2px solid var(--gd);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand,.hr{display:flex;gap:12px;align-items:center}
h1{font-size:18px;margin:0;color:#fff}h1 small{display:block;font:11px system-ui;color:#e8c9c4;letter-spacing:1px;text-transform:none}
.clock{text-align:right;font-variant-numeric:tabular-nums;color:#fff}.clock b{font-size:18px}.clock .mu{color:#e8c9c4}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input,textarea,button{font:inherit;color:var(--tx);background:#120e0d;border:1px solid var(--bd);border-radius:4px;padding:8px 10px}
input:focus,select:focus{outline:none;border-color:var(--gd)}
button{cursor:pointer}button:hover{border-color:var(--gd)}
button.p{background:var(--ac);color:#fff;border-color:var(--gd);font-family:Cinzel,Georgia,serif;letter-spacing:1px;text-transform:uppercase;font-size:13px}
.tabs{border-bottom:1px solid var(--bd);gap:0}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 16px;font-family:Cinzel,Georgia,serif;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--mu)}
.tabs button.on{color:var(--gd);border-bottom-color:var(--gd)}
.card{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:14px;margin-bottom:12px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}form .w{grid-column:1/-1}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;letter-spacing:.5px}
label input,label select{text-transform:none;letter-spacing:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--bd);padding:10px 0}
.row:first-child{border-top:none}.t{font-variant-numeric:tabular-nums;font-weight:700;min-width:120px;color:var(--gd)}
.mu{color:var(--mu);font-size:13px}.err{color:#ff8a80;font-weight:600;min-height:20px;font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--gd);color:var(--gd)}
.s-Hecha{color:var(--ac2)}.s-Cancelada{color:var(--mu);text-decoration:line-through}.s-Programada{color:var(--wn)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stats div{flex:1;min-width:110px;background:var(--card);border:1px solid var(--bd);border-top:2px solid var(--ac);border-radius:6px;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}.stats b{font-size:24px;display:block;color:var(--gd);font-family:Cinzel,Georgia,serif}
.sc{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:4px;min-width:520px}.cal .h{font-size:12px;color:var(--gd);text-align:center}.cal .d{min-height:78px;background:#120e0d;border:1px solid var(--bd);border-radius:4px;padding:4px;cursor:pointer;font-size:11px;overflow:hidden}.cal .d.sel{outline:2px solid var(--gd)}.cal .d.td>b{color:#ff8a80}.cal .d i{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;color:var(--mu)}
#login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#3a1613 0,#0d0908 70%)}
#login[hidden]{display:none}
.lc{width:100%;max-width:360px;background:var(--card);border:1px solid var(--gd);border-radius:8px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lc h2{margin:4px 0 0;font-size:18px;color:var(--gd)}.lc p{margin:0;color:var(--mu);font-size:13px}.lc input,.lc button{width:100%}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 48 56" width="36" aria-hidden="true"><path d="M24 2 4 10v18c0 14 9 22 20 26 11-4 20-12 20-26V10z" fill="#8b1e1e" stroke="#c9a24b" stroke-width="2.5"/><path d="M14 22l10-8 10 8M14 32l10-8 10 8" fill="none" stroke="#c9a24b" stroke-width="2.5"/></svg><h1>Panel de Control<small>AOT Exodus · Equipo Administrativo</small></h1></div>
  <div class="hr"><div class="clock"><b id="ck"></b><div class="mu" id="ck2"></div></div><button id="out">Cerrar sesión</button></div>
</header>
<div id="login"><div class="lc"><svg viewBox="0 0 48 56" width="64" aria-hidden="true"><path d="M24 2 4 10v18c0 14 9 22 20 26 11-4 20-12 20-26V10z" fill="#8b1e1e" stroke="#c9a24b" stroke-width="2.5"/><path d="M14 22l10-8 10 8M14 32l10-8 10 8" fill="none" stroke="#c9a24b" stroke-width="2.5"/></svg><h2>Registro Administrativo</h2><p>AOT Exodus · Acceso exclusivo del staff</p>
<input type="password" id="pw" placeholder="Clave del staff" autocomplete="current-password"><div class="err" id="le"></div><button class="p" id="lb">Iniciar sesión</button></div></div>
<main>
  <div class="bar">
    <label>Zona horaria de visualización
      <select id="tz"></select>
    </label>
    <label>Día (según GMT+1)<input type="date" id="day"></label>
    <button id="today">Hoy</button>
    <span class="mu" id="sync"></span>
  </div>
  <div class="tabs bar" style="margin-bottom:0"><button id="b1" class="on">Agenda de PDs</button><button id="b2">Tickets</button></div>

  <section id="s1">
    <div class="card" style="border-top-left-radius:0">
      <form id="fp">
        <label>Host<input name="host" required placeholder="Staff host"></label>
        <label>Co-host<input name="co" placeholder="Opcional"></label>
        <label>Rama / tipo<select name="rama"><option>Cuerpo de Exploración</option><option>Guarnición</option><option>Policía Militar</option><option>SOL (Slice of Life)</option></select></label>
        <label>Inicio (hora GMT+1)<input type="datetime-local" name="at" required></label>
        <label>Duración (min)<input type="number" name="du" value="60" min="10" step="5" required></label>
        <label class="w">Notas<input name="nt" placeholder="Contexto, escena, requisitos…"></label>
        <div class="w"><button class="p">Agendar PD</button> <span class="err" id="e1"></span></div>
      </form>
    </div>
    <div class="card"><div class="bar" style="margin:0 0 8px;justify-content:center"><button id="pm">◀</button><b id="mt" style="min-width:150px;text-align:center;text-transform:capitalize"></b><button id="nm">▶</button></div><div class="sc"><div id="cal" class="cal"></div></div><div class="mu" style="margin-top:6px">Toca un día para ver su detalle. Los días se agrupan según GMT+1; las horas, en la zona que elijas arriba.</div></div>
    <div class="stats" id="st1"></div>
    <div class="card" style="margin-top:12px"><div class="bar" style="margin:0 0 6px"><b>PDs del día</b></div><div id="l1"></div></div>
  </section>

  <section id="s2" hidden>
    <div class="card" style="border-top-left-radius:0">
      <form id="ft">
        <label>N.º ticket<input name="id" required placeholder="#0000"></label>
        <label>Jugador<input name="pl" required></label>
        <label>Categoría<select name="cat"><option>Reporte</option><option>Apelación</option><option>Duda / soporte</option><option>PD / Perma death</option><option>Otro</option></select></label>
        <label>Atendido por<input name="st" required></label>
        <label>Estado<select name="es"><option>Resuelto</option><option>Pendiente</option><option>Escalado</option></select></label>
        <label class="w">Resumen / resolución<input name="nt"></label>
        <div class="w"><button class="p">Registrar ticket</button></div>
      </form>
    </div>
    <div class="stats" id="st2"></div>
    <div class="card sc" style="margin-top:12px"><div id="l2"></div></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s),H=3600000;
const ZONES=[["Etc/GMT-1","GMT+1 (servidor)"],["local","Mi hora local"],["UTC","UTC"],["Europe/Madrid","España"],["America/Mexico_City","México"],["America/Bogota","Colombia / Perú"],["America/Santiago","Chile"],["America/Argentina/Buenos_Aires","Argentina"],["America/New_York","Nueva York"],["America/Los_Angeles","Los Ángeles"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tzv=()=>$("#tz").value==="local"?undefined:$("#tz").value;
const fT=(ms,z)=>new Intl.DateTimeFormat("es",{timeZone:z===undefined?tzv():z==="local"?undefined:z,hour:"2-digit",minute:"2-digit",hour12:false}).format(ms);
const fD=(ms)=>new Intl.DateTimeFormat("es",{timeZone:tzv(),weekday:"short",day:"numeric",month:"short"}).format(ms);
const dk=ms=>new Date(ms+H).toISOString().slice(0,10);
$("#tz").innerHTML=ZONES.map(z=>`<option value="${z[0]}">${z[1]}</option>`).join("");
try{const v=localStorage.getItem("tz");if(v)$("#tz").value=v}catch(e){}
$("#day").value=dk(Date.now());
function tick(){const n=Date.now();$("#ck").textContent=fT(n,"Etc/GMT-1")+" GMT+1";$("#ck2").textContent=fT(n,"local")+" tu hora · "+fT(n,"UTC")+" UTC"}
setInterval(tick,1000);tick();

// Almacén: API de Netlify (Functions + Blobs)
const data={pds:[],tickets:[]},stores={};
let KEY="";try{KEY=sessionStorage.getItem("k")||""}catch(e){}
async function call(path,opt={}){
  const r=await fetch(path,{...opt,headers:{"content-type":"application/json","x-staff-key":KEY}});
  if(r.status===401){KEY="";try{sessionStorage.removeItem("k")}catch(e){}throw 401}
  if(!r.ok)throw r.status;
  return r.json();
}
function ask(){$("#login").hidden=false;$("#pw").focus()}
$("#lb").onclick=()=>{const k=$("#pw").value.trim();if(!k)return;KEY=k;$("#le").textContent="";load()};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#lb").click()};
$("#out").onclick=()=>{KEY="";try{sessionStorage.removeItem("k")}catch(e){}data.pds=[];data.tickets=[];$("#pw").value="";render();ask()};
async function load(){
  if(!KEY)return ask();
  try{
    for(const c of["pds","tickets"])data[c]=await call("/api?c="+c);
    try{sessionStorage.setItem("k",KEY)}catch(e){}
    $("#login").hidden=true;
    $("#sync").textContent="🟢 Sincronizado "+new Date().toLocaleTimeString();render();
  }catch(e){
    if(e===401){$("#le").textContent="⚠️ Clave incorrecta. Acceso denegado.";ask()}
    else{$("#sync").textContent="🔴 Sin conexión con el servidor";if(!$("#login").hidden)$("#le").textContent="Sin conexión con el servidor."}
  }
}
for(const c of["pds","tickets"])stores[c]={
  set:async(id,o)=>{
    const i=data[c].findIndex(x=>x.id===id),r={...o,id};i<0?data[c].push(r):data[c][i]=r;render();
    try{await call("/api",{method:"POST",body:JSON.stringify({c,op:"set",id,data:o})})}
    catch(e){load();if(e===409)alert("⛔ Esa PD se cruza con otra ya agendada (otro staff acaba de agendar).")}
  },
  del:async id=>{
    data[c]=data[c].filter(x=>x.id!==id);render();
    try{await call("/api",{method:"POST",body:JSON.stringify({c,op:"del",id})})}catch(e){load()}
  }
};
setInterval(()=>{if(KEY&&!document.hidden)load()},10000);
load();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// Tabs
for(const[n,b]of[["1","b1"],["2","b2"]])$("#"+b).onclick=()=>{$("#s1").hidden=n!=="1";$("#s2").hidden=n!=="2";$("#b1").classList.toggle("on",n==="1");$("#b2").classList.toggle("on",n==="2")};
$("#tz").onchange=()=>{try{localStorage.setItem("tz",$("#tz").value)}catch(e){}render()};
let cm=dk(Date.now()).slice(0,7);
const sh=d=>{const[y,m]=cm.split("-").map(Number);return new Date(Date.UTC(y,m-1+d,1)).toISOString().slice(0,7)};
$("#pm").onclick=()=>{cm=sh(-1);render()};$("#nm").onclick=()=>{cm=sh(1);render()};
window.pick=k=>{$("#day").value=k;cm=k.slice(0,7);render()};
$("#day").onchange=()=>{cm=$("#day").value.slice(0,7);render()};$("#today").onclick=()=>{$("#day").value=dk(Date.now());cm=$("#day").value.slice(0,7);render()};
function calR(){
 const[y,m]=cm.split("-").map(Number);
 $("#mt").textContent=new Intl.DateTimeFormat("es",{timeZone:"UTC",month:"long",year:"numeric"}).format(Date.UTC(y,m-1,1));
 const off=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(y,m,0)).getUTCDate();
 let h=["L","M","X","J","V","S","D"].map(x=>`<div class="h">${x}</div>`).join("");
 for(let i=0;i<off;i++)h+="<div></div>";
 for(let d=1;d<=n;d++){const k=`${cm}-${String(d).padStart(2,"0")}`;
  const l=data.pds.filter(p=>dk(p.start)===k&&p.status!=="Cancelada").sort((a,b)=>a.start-b.start);
  h+=`<div class="d${k===$("#day").value?" sel":""}${k===dk(Date.now())?" td":""}" onclick="pick('${k}')"><b>${d}</b>${l.slice(0,3).map(p=>`<i>${fT(p.start)} ${esc(String(p.rama||"").split(" ")[0])}</i>`).join("")}${l.length>3?`<i>+${l.length-3} más</i>`:""}</div>`}
 $("#cal").innerHTML=h;
}

// PDs
$("#fp").onsubmit=async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const s=Date.parse(f.at+":00+01:00"),d=+f.du*60000,en=s+d;
  const c=data.pds.find(p=>p.status!=="Cancelada"&&s<p.start+p.dur&&p.start<en);
  if(c){$("#e1").textContent=`⛔ Se cruza con la PD de ${c.host} — ${c.rama} (${fT(c.start,"Etc/GMT-1")}–${fT(c.start+c.dur,"Etc/GMT-1")} GMT+1)`;return}
  $("#e1").textContent="";
  await stores.pds.set(uid(),{host:f.host,co:f.co,rama:f.rama,start:s,dur:d,nt:f.nt,status:"Programada"});
  e.target.host.value=e.target.co.value=e.target.nt.value="";
};
window.setS=(id,v)=>{const p=data.pds.find(x=>x.id===id);stores.pds.set(id,{...p,status:v})};
window.delP=id=>confirm("¿Eliminar esta PD?")&&stores.pds.del(id);
const dayPds=()=>data.pds.filter(p=>dk(p.start)===$("#day").value).sort((a,b)=>a.start-b.start);

// Tickets
$("#ft").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  await stores.tickets.set(uid(),{tid:f.id,pl:f.pl,cat:f.cat,st:f.st,es:f.es,nt:f.nt,at:Date.now()});
  e.target.id.value=e.target.pl.value=e.target.nt.value="";};
window.setT=(id,v)=>{const t=data.tickets.find(x=>x.id===id);stores.tickets.set(id,{...t,es:v})};
window.delT=id=>confirm("¿Eliminar ticket?")&&stores.tickets.del(id);

function render(){
  calR();
  const l=dayPds(),ds=$("#day").value;
  $("#st1").innerHTML=["Programada","Hecha","Cancelada"].map(s=>`<div><b>${l.filter(p=>p.status===s).length}</b>${s}s</div>`).join("");
  $("#l1").innerHTML=l.map(p=>`<div class="row"><div><span class="t">${fT(p.start)}–${fT(p.start+p.dur)}</span> <span class="mu">${fT(p.start,"Etc/GMT-1")} GMT+1</span></div>
  <div style="flex:1;min-width:160px"><b class="s-${p.status}">${esc(p.rama)}</b> <span class="mu">Host: ${esc(p.host)}${p.co?" · Co-host: "+esc(p.co):""}</span><div class="mu">${esc(p.nt)}</div></div>
  <div><select onchange="setS('${p.id}',this.value)">${["Programada","Hecha","Cancelada"].map(s=>`<option${s===p.status?" selected":""}>${s}</option>`).join("")}</select> <button onclick="delP('${p.id}')">🗑</button></div></div>`).join("")||'<div class="mu">No hay PDs agendadas este día.</div>';
  const T=[...data.tickets].sort((a,b)=>b.at-a.at),hoy=T.filter(t=>dk(t.at)===dk(Date.now()));
  const by={};T.forEach(t=>by[t.st]=(by[t.st]||0)+1);
  $("#st2").innerHTML=`<div><b>${hoy.length}</b>Hoy</div><div><b>${T.length}</b>Total</div><div><b>${T.filter(t=>t.es==="Pendiente").length}</b>Pendientes</div>`+Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`<div><b>${v}</b>${esc(k)}</div>`).join("");
  $("#l2").innerHTML=T.map(t=>`<div class="row"><div style="min-width:140px"><b>${esc(t.tid)}</b> <span class="tag">${esc(t.cat)}</span><div class="mu">${fD(t.at)} ${fT(t.at)}</div></div>
  <div style="flex:1;min-width:160px">${esc(t.pl)} <span class="mu">· ${esc(t.st)}</span><div class="mu">${esc(t.nt)}</div></div>
  <div><select onchange="setT('${t.id}',this.value)">${["Resuelto","Pendiente","Escalado"].map(s=>`<option${s===t.es?" selected":""}>${s}</option>`).join("")}</select> <button onclick="delT('${t.id}')">🗑</button></div></div>`).join("")||'<div class="mu">Aún no hay tickets registrados.</div>';
}
render();
</script>
</body>
</html>
